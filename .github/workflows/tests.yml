name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m venv venv
        . venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: setup
    env:
      FULL_NAME: "Тевелев Артём Дмитриевич"
      GROUP_NUMBER: "M3111" 

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Run tests with pytest
      run: |
        echo "Running tests for $FULL_NAME"
        . venv/bin/activate
        pytest --maxfail=1 --disable-warnings -q

  lint:
    runs-on: ubuntu-latest
    needs: setup

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Check code style with flake8
      run: |
        . venv/bin/activate
        flake8 .

  format:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Format code with black
      run: |
        . venv/bin/activate
        black .
