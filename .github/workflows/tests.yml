name: CI Workflow

on:
  push:
    branches:
      - main
      - release

  pull_request:
    branches:
      - main
      - release
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FULL_NAME: "Тевелев Артём Дмитриевич"
      GROUP_NUMBER: "M3111"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Display personal information
        run: echo "Full Name:${{ env.FULL_NAME }}, Group Number:${{ env.GROUP_NUMBER }}, GitHub Username:${{ github.actor }}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover

      - name: Lint code
        run: |
          pip install flake8
          flake8 .